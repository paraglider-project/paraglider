version: "2"
run:
  build-tags:
    - unit
    - integration
linters:
  enable:
    - goheader
  settings:
    goheader:
      template-path: build/header.tmpl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goheader
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
